<!DOCTYPE html>
<html>
<head>

<title>Tables 2-10</title>

<style>

body{
    font-family:Arial;
    margin:20px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    width:180px;
}

</style>

</head>

<body>

<h1>Multiplication Tables 2 to 10</h1>

<div class="container">

{% for num, rows in tables.items() %}

<div class="card">

<h2>Table {{num}}</h2>

{% for row in rows %}
<p>{{row}}</p>
{% endfor %}

</div>

{% endfor %}

</div>

</body>
</html>
